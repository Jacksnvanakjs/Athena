<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美股资金变化</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 24px 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .sub { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-dark { background: #0f172a; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .panel h2 { font-size: 1rem; margin-bottom: 12px; }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .toolbar select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .legend-bar {
      width: 140px;
      height: 10px;
      border-radius: 4px;
      background: linear-gradient(90deg, #15803d, #86efac, #64748b, #fca5a5, #dc2626);
    }
    #treemap {
      width: 100%;
      height: 620px;
      border-radius: 8px;
      overflow: hidden;
      background: #0f172a;
    }
    .small-labels {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .small-chip {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      cursor: default;
    }
    .loading { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .rank-list { list-style: none; }
    .rank-list li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .rank-list li:last-child { border-bottom: none; }
    /* A股习惯：红涨绿跌 */
    .up { color: #dc2626; font-weight: 600; }
    .down { color: #15803d; font-weight: 600; }
    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
    }
    .section-foot {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 10px;
    }
    .timer-label {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 400;
      white-space: nowrap;
    }
    .theme-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 10px;
    }
    .theme-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      min-height: 44px;
    }
    .theme-chip:hover { background: #eef2ff; border-color: #93c5fd; }
    .theme-chip.active { background: #dbeafe; border-color: #2563eb; }
    .theme-chip .theme-left { display: flex; flex-direction: column; gap: 3px; }
    .theme-chip .tname { font-weight: 650; line-height: 1.1; }
    .theme-chip .tmeta { color: var(--text-muted); font-size: 0.72rem; line-height: 1.1; }
    .theme-chip .pct { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 0.95rem; }
    .theme-note { color: var(--text-muted); font-size: 0.75rem; margin-top: 8px; display: none; }
    .muted { color: var(--text-muted); }
    .note {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .breadcrumb {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .breadcrumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .info-box {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 0.84rem;
      line-height: 1.65;
      color: var(--text);
    }
    .info-box h3 {
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .info-box ul { margin: 6px 0 10px 1.1em; color: var(--text-muted); }
    .info-box li { margin: 2px 0; }
    .info-box .muted { font-size: 0.8rem; }
    .help {
      display: inline-block;
      margin-left: 4px;
      width: 16px;
      height: 16px;
      line-height: 16px;
      text-align: center;
      border-radius: 50%;
      background: #e2e8f0;
      color: #475569;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: help;
      vertical-align: middle;
    }
    .tip {
      cursor: help;
      border-bottom: 1px dotted currentColor;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>美股资金变化</h1>
        <div class="sub" id="metaLine">加载中...</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <a class="btn btn-dark" href="/">基金监测</a>
        <a class="btn" href="/deals" style="background:#1e3a5f;color:#fff;text-decoration:none">AI 产业链合作快讯</a>
        <button class="btn btn-dark" id="snapBtn" onclick="saveSnapshot()">存今日快照</button>
        <button class="btn btn-primary" id="refreshBtn" onclick="reloadAll(true)">刷新</button>
      </div>
    </header>

    <!-- 主题涨跌幅 -->
    <div class="section-card" id="themePanel">
      <div class="section-header">
        <h2>主题涨跌幅（实时）</h2>
        <span class="help" title="有ETF的主题使用ETF实时价格（最准确），其余为成分股等权平均。红涨绿跌。">?</span>
        <span id="themeTimer" class="timer-label"></span>
      </div>
      <div class="theme-strip" id="themeStrip">
        <span class="muted">加载中...</span>
      </div>
      <p class="section-foot" id="themeNote">仅「今日实时」模式展示 · 点击主题查看成分股</p>
    </div>

    <!-- 板块资金流向 -->
    <div class="section-card" id="flowPanel">
      <div class="section-header">
        <h2>板块资金流向</h2>
        <span class="help" title="左侧=资金流出板块，右侧=资金流入板块。曲线粗细代表该板块成交额相对占比。金额=涨跌幅×成交额的代理指标，非真实资金流。">?</span>
        <span id="flowTimer" class="timer-label"></span>
      </div>
      <div id="flowChart" style="width:100%;position:relative;overflow:auto"></div>
      <p class="section-foot">38个细分主题 · 左绿=下跌/流出 右红=上涨/流入 · 按涨跌幅排序</p>
    </div>

    <!-- 美股资金热力图 -->
    <div class="section-card" id="heatmapSection">
      <div class="section-header">
        <h2>美股资金热力图</h2>
        <span class="help" title="按「资金流入/流出」着色：红=流入、绿=流出。面积 = 成交额占比。不是股价涨跌。">?</span>
        <span id="heatmapTimer" class="timer-label"></span>
      </div>

    <div class="layout">
      <div>
        <div class="toolbar">
          <select id="viewMode" onchange="render()">
            <option value="sector">板块视图</option>
            <option value="company">公司视图</option>
          </select>
          <select id="periodSelect" onchange="loadStats()">
            <option value="live" selected>今日实时</option>
            <option value="1d">每天</option>
            <option value="1w">每周</option>
            <option value="15d">每半月</option>
            <option value="1m">每月</option>
            <option value="2m">每2个月</option>
            <option value="3m">每3个月</option>
          </select>
          <div class="legend">
            <span class="down">流出</span>
            <div class="legend-bar"></div>
            <span class="up">流入</span>
          </div>
        </div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div id="treemap"><div class="loading">正在拉取美股数据...</div></div>
        <div class="small-labels" id="smallLabels"></div>
        <p class="note" id="note"></p>
      </div>

      <div>
        <div class="panel" style="margin-bottom:16px">
          <h2><span id="rankTitle1">资金流入最多板块</span> <span class="help" title="右侧%：该板块资金活跃度占本站监控的主要板块合计的比重（正=流入）。不是股价涨跌，也不是全市场资金占比。总量=本站约11个主要板块，非美股全部板块。">?</span></h2>
          <ul class="rank-list" id="topSectors"></ul>
        </div>
        <div class="panel" style="margin-bottom:16px">
          <h2><span id="rankTitleOutSectors">资金流出最多板块</span> <span class="help" title="右侧%：该板块资金活跃度占本站主要板块合计的比重（负=流出）。总量仅含本站监控板块，非全市场。">?</span></h2>
          <ul class="rank-list" id="bottomSectors"></ul>
        </div>
        <div class="panel" style="margin-bottom:16px">
          <h2><span id="rankTitle2">资金流入最多公司</span> <span class="help" title="右侧%：该公司资金活跃度占本站监控龙头股合计的比重（正=流入）。总量=本站样本公司，非美股全部股票。">?</span></h2>
          <ul class="rank-list" id="topCompanies"></ul>
        </div>
        <div class="panel">
          <h2><span id="rankTitle3">资金流出最多公司</span> <span class="help" title="右侧%：该公司资金活跃度占本站监控龙头股合计的比重（负=流出）。总量=本站样本公司，非美股全部股票。">?</span></h2>
          <ul class="rank-list" id="bottomCompanies"></ul>
        </div>
      </div>
    </div>
    </div>
  </div>

  <script>
    let liveData = null;
    let statsData = null;
    let focusSector = null;
    let focusTheme = null;

    function currentPeriod() {
      return document.getElementById('periodSelect').value;
    }

    function usingLive() {
      return currentPeriod() === 'live';
    }

    function fmtPct(v) {
      const n = Number(v || 0);
      const sign = n > 0 ? '+' : '';
      return sign + n.toFixed(2) + '%';
    }

    function fmtMoney(v) {
      const n = Number(v || 0);
      if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      return n.toFixed(0);
    }

    function absFlowTotal(items, key) {
      const k = key || 'flow_score';
      return (items || []).reduce((s, i) => s + Math.abs(Number(i[k] || 0)), 0) || 1;
    }

    function flowSharePct(flow, totalAbs) {
      return Number(flow || 0) / (totalAbs || 1) * 100;
    }

    function colorForFlow(flowPct) {
      // 按资金流占比着色：红=流入，绿=流出（A股习惯）
      const t = Math.max(-25, Math.min(25, Number(flowPct || 0))) / 25;
      if (Math.abs(t) < 0.02) return '#475569';
      if (t > 0) {
        const intensity = 0.35 + 0.65 * t;
        return `rgb(${Math.round(180 + 75 * intensity)}, ${Math.round(40 * (1 - intensity))}, ${Math.round(40 * (1 - intensity))})`;
      }
      const intensity = 0.35 + 0.65 * Math.abs(t);
      return `rgb(${Math.round(30 * (1 - intensity))}, ${Math.round(120 + 80 * intensity)}, ${Math.round(60 * (1 - intensity))})`;
    }

    function pctClass(v) {
      return Number(v || 0) >= 0 ? 'up' : 'down';
    }

    function escAttr(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/\n/g, ' ');
    }

    function tipFlowShare(flowPct, flow, pricePct) {
      return escAttr(
        '例读法：' + fmtPct(flowPct) +
        ' = 该标的资金活跃度占本站监控样本合计的比重（正流入/负流出）。' +
        '不是股价涨跌，也不是全市场资金占比。总量仅含本站主要板块/龙头股。' +
        (pricePct != null ? ' 股价涨跌 ' + fmtPct(pricePct) + '。' : '')
      );
    }

    function renderThemes() {
      const strip = document.getElementById('themeStrip');
      const panel = document.getElementById('themePanel');
      const note = document.getElementById('themeNote');
      if (!usingLive()) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'block';
      if (!liveData || liveData.success === false || !(liveData.themes || []).length) {
        strip.innerHTML = '<span class="muted">暂无主题行情</span>';
        return;
      }
      strip.innerHTML = liveData.themes.map(t => {
        const active = focusTheme === t.key ? ' active' : '';
        const src = t.etf ? `ETF:${t.etf}` : `成分股 ${t.quote_count}/${t.quote_total}`;
        return `<button type="button" class="theme-chip${active}" onclick="selectTheme('${t.key}')">
          <span class="theme-left">
            <span class="tname">${t.name}</span>
            <span class="tmeta">${src}</span>
          </span>
          <span class="pct ${pctClass(t.change_pct)}">${fmtPct(t.change_pct)}</span>
        </button>`;
      }).join('');
      note.textContent = '有ETF的主题使用ETF实时价格，其余为成分股等权平均 · 点击主题查看成分股';
    }

    function renderFlow() {
      const container = document.getElementById('flowChart');
      const panel = document.getElementById('flowPanel');
      if (!usingLive()) { panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      if (!liveData || !liveData.themes) { container.innerHTML = '<span class="muted">暂无数据</span>'; return; }

      const themes = liveData.themes.filter(t => Math.abs(t.change_pct) > 0.001);
      const outflow = themes.filter(t => t.change_pct < 0).sort((a,b) => a.change_pct - b.change_pct);
      const inflow = themes.filter(t => t.change_pct > 0).sort((a,b) => b.change_pct - a.change_pct);
      if (!outflow.length && !inflow.length) { container.innerHTML = '<span class="muted">当前无明显资金流向</span>'; return; }

      const W = container.clientWidth || 900;
      const rowH = 28;
      const maxRows = Math.max(outflow.length, inflow.length, 1);
      const headerH = 36;
      const H = headerH + maxRows * rowH + 10;
      const midX = W / 2;
      const colGap = 20;

      const halfW = midX - colGap / 2;
      const nameLabelW = 100;
      const pctLabelW = 65;
      const barMaxW = halfW - nameLabelW - pctLabelW - 16;

      const maxAbsPct = Math.max(
        ...outflow.map(s => Math.abs(s.change_pct)),
        ...inflow.map(s => Math.abs(s.change_pct)), 0.01
      );

      let svg = `<svg width="${W}" height="${H}" style="display:block;font-family:-apple-system,BlinkMacSystemFont,sans-serif;border-radius:10px" viewBox="0 0 ${W} ${H}">`;

      // Background
      svg += `<rect width="${W}" height="${H}" rx="10" fill="#fff"/>`;

      // Column headers with background
      svg += `<rect x="0" y="0" width="${midX - colGap/2}" height="${headerH - 4}" rx="10" fill="#f0fdf4"/>`;
      svg += `<rect x="${midX + colGap/2}" y="0" width="${halfW}" height="${headerH - 4}" rx="10" fill="#fef2f2"/>`;
      svg += `<text x="14" y="${headerH - 14}" fill="#15803d" font-size="13" font-weight="700">资金流出板块（绿色）</text>`;
      svg += `<text x="${W - 14}" y="${headerH - 14}" fill="#dc2626" font-size="13" font-weight="700" text-anchor="end">资金流入方向（红色）</text>`;

      // Center divider
      svg += `<line x1="${midX}" y1="${headerH}" x2="${midX}" y2="${H - 4}" stroke="#e2e8f0" stroke-width="1"/>`;

      // --- Outflow (left): name | pct | ████ bar grows rightward toward center ---
      outflow.forEach((s, i) => {
        const y = headerH + i * rowH;
        const cy = y + rowH / 2;
        const pct = Math.abs(s.change_pct);
        const bw = Math.max(6, (pct / maxAbsPct) * barMaxW);
        const barX = midX - colGap / 2 - bw;

        // Alternating row bg
        if (i % 2 === 0) svg += `<rect x="0" y="${y}" width="${midX - colGap/2}" height="${rowH}" fill="#f8faf9" opacity="0.6"/>`;

        // Bar (grows leftward from center edge)
        svg += `<rect x="${barX}" y="${y + 5}" width="${bw}" height="${rowH - 11}" rx="4" fill="#16a34a" opacity="0.85"/>`;

        // Name (left)
        svg += `<text x="10" y="${cy}" fill="#1e293b" font-size="12" font-weight="600" dominant-baseline="middle">${s.name}</text>`;

        // Pct (between name and bar)
        svg += `<text x="${barX - 6}" y="${cy}" text-anchor="end" fill="#15803d" font-size="11" font-weight="700" dominant-baseline="middle">${s.change_pct.toFixed(2)}%</text>`;
      });

      // --- Inflow (right): bar ████ | pct | name ---
      inflow.forEach((s, i) => {
        const y = headerH + i * rowH;
        const cy = y + rowH / 2;
        const pct = Math.abs(s.change_pct);
        const bw = Math.max(6, (pct / maxAbsPct) * barMaxW);
        const barX = midX + colGap / 2;

        // Alternating row bg
        if (i % 2 === 0) svg += `<rect x="${midX + colGap/2}" y="${y}" width="${halfW}" height="${rowH}" fill="#fef7f7" opacity="0.6"/>`;

        // Bar (grows rightward from center edge)
        svg += `<rect x="${barX}" y="${y + 5}" width="${bw}" height="${rowH - 11}" rx="4" fill="#dc2626" opacity="0.85"/>`;

        // Pct
        svg += `<text x="${barX + bw + 6}" y="${cy}" fill="#dc2626" font-size="11" font-weight="700" dominant-baseline="middle">+${s.change_pct.toFixed(2)}%</text>`;

        // Name (right)
        svg += `<text x="${W - 10}" y="${cy}" text-anchor="end" fill="#1e293b" font-size="12" font-weight="600" dominant-baseline="middle">${s.name}</text>`;
      });

      svg += '</svg>';
      container.innerHTML = svg;
    }

    function selectTheme(key) {
      focusTheme = focusTheme === key ? null : key;
      focusSector = null;
      document.getElementById('viewMode').value = 'company';
      renderThemes();
      render();
    }

    function renderSidebar() {
      const topS = document.getElementById('topSectors');
      const botS = document.getElementById('bottomSectors');
      const topC = document.getElementById('topCompanies');
      const botC = document.getElementById('bottomCompanies');
      const periodLabel = usingLive() ? '今日' : ((statsData && statsData.label) || '');

      document.getElementById('rankTitle1').textContent = periodLabel + '资金流入最多板块';
      document.getElementById('rankTitleOutSectors').textContent = periodLabel + '资金流出最多板块';
      document.getElementById('rankTitle2').textContent = periodLabel + '资金流入最多公司';
      document.getElementById('rankTitle3').textContent = periodLabel + '资金流出最多公司';

      if (usingLive()) {
        if (!liveData) return;
        if (liveData.success === false) {
          const msg = liveData.note || '行情拉取失败';
          topS.innerHTML = botS.innerHTML = topC.innerHTML = botC.innerHTML =
            `<li class="muted">${msg}</li>`;
          return;
        }
        const secTotal = absFlowTotal(liveData.sectors, 'flow_score');
        const allCos = (liveData.sectors || []).flatMap(s => s.companies || []);
        const cosTotal = absFlowTotal(allCos, 'flow_score');
        topS.innerHTML = (liveData.top_inflow_sectors || []).map(s => {
          const fp = flowSharePct(s.flow_score, secTotal);
          return `
          <li>
            <span><a href="#" onclick="focusSector='${s.key}';document.getElementById('viewMode').value='company';render();return false">${s.name}</a></span>
            <span class="tip ${pctClass(fp)}" title="${tipFlowShare(fp, s.flow_score, s.change_pct)}">${fmtPct(fp)}</span>
          </li>`;
        }).join('') || '<li class="muted">暂无</li>';
        botS.innerHTML = (liveData.top_outflow_sectors || []).map(s => {
          const fp = flowSharePct(s.flow_score, secTotal);
          return `
          <li>
            <span><a href="#" onclick="focusSector='${s.key}';document.getElementById('viewMode').value='company';render();return false">${s.name}</a></span>
            <span class="tip ${pctClass(fp)}" title="${tipFlowShare(fp, s.flow_score, s.change_pct)}">${fmtPct(fp)}</span>
          </li>`;
        }).join('') || '<li class="muted">暂无</li>';
        topC.innerHTML = (liveData.top_inflow_companies || []).map(c => {
          const fp = flowSharePct(c.flow_score, cosTotal);
          return `
          <li><span>${c.cn_name || c.name} <span class="muted">${c.symbol}</span></span>
          <span class="tip ${pctClass(fp)}" title="${tipFlowShare(fp, c.flow_score, c.change_pct)}">${fmtPct(fp)}</span></li>`;
        }).join('') || '<li class="muted">暂无</li>';
        botC.innerHTML = (liveData.top_outflow_companies || []).map(c => {
          const fp = flowSharePct(c.flow_score, cosTotal);
          return `
          <li><span>${c.cn_name || c.name} <span class="muted">${c.symbol}</span></span>
          <span class="tip ${pctClass(fp)}" title="${tipFlowShare(fp, c.flow_score, c.change_pct)}">${fmtPct(fp)}</span></li>`;
        }).join('') || '<li class="muted">暂无</li>';
        return;
      }

      if (!statsData) {
        topS.innerHTML = botS.innerHTML = topC.innerHTML = botC.innerHTML = '<li class="muted">加载中...</li>';
        return;
      }
      if (!statsData.sufficient) {
        const tip = `<li class="muted">${statsData.note || '数据还不足'}</li>`;
        topS.innerHTML = tip;
        botS.innerHTML = topC.innerHTML = botC.innerHTML = '<li class="muted">暂无数据</li>';
        return;
      }

      const secTotal = absFlowTotal(statsData.sectors, 'flow_score_sum');
      const cosTotal = absFlowTotal(statsData.companies, 'flow_score_sum');
      topS.innerHTML = (statsData.top_inflow_sectors || []).map(s => {
        const fp = flowSharePct(s.flow_score_sum, secTotal);
        return `
        <li>
          <span><a href="#" onclick="focusSector='${s.sector_key}';document.getElementById('viewMode').value='company';render();return false">${s.cn_name || s.name}</a></span>
          <span class="tip ${pctClass(fp)}" title="${tipFlowShare(fp, s.flow_score_sum, s.period_change_pct)}">${fmtPct(fp)}</span>
        </li>`;
      }).join('') || '<li class="muted">暂无</li>';
      botS.innerHTML = (statsData.top_outflow_sectors || []).map(s => {
        const fp = flowSharePct(s.flow_score_sum, secTotal);
        return `
        <li>
          <span><a href="#" onclick="focusSector='${s.sector_key}';document.getElementById('viewMode').value='company';render();return false">${s.cn_name || s.name}</a></span>
          <span class="tip ${pctClass(fp)}" title="${tipFlowShare(fp, s.flow_score_sum, s.period_change_pct)}">${fmtPct(fp)}</span>
        </li>`;
      }).join('') || '<li class="muted">暂无</li>';
      topC.innerHTML = (statsData.top_inflow_companies || []).map(c => {
        const fp = flowSharePct(c.flow_score_sum, cosTotal);
        return `
        <li><span>${c.cn_name || c.name} <span class="muted">${c.symbol}</span></span>
        <span class="tip ${pctClass(fp)}" title="${tipFlowShare(fp, c.flow_score_sum, c.period_change_pct)}">${fmtPct(fp)}</span></li>`;
      }).join('') || '<li class="muted">暂无</li>';
      botC.innerHTML = (statsData.top_outflow_companies || []).map(c => {
        const fp = flowSharePct(c.flow_score_sum, cosTotal);
        return `
        <li><span>${c.cn_name || c.name} <span class="muted">${c.symbol}</span></span>
        <span class="tip ${pctClass(fp)}" title="${tipFlowShare(fp, c.flow_score_sum, c.period_change_pct)}">${fmtPct(fp)}</span></li>`;
      }).join('') || '<li class="muted">暂无</li>';
    }

    function buildHierarchyFromLive() {
      const mode = document.getElementById('viewMode').value;
      if (mode === 'sector') {
        return {
          name: 'root',
          children: liveData.sectors.map(s => ({
            name: s.name,
            key: s.key,
            change_pct: s.change_pct,
            dollar_volume: Math.max(s.dollar_volume, 1),
            flow_score: s.flow_score,
            value: Math.max(Math.abs(s.flow_score) * 1e9, s.dollar_volume * 0.05, 1),
          }))
        };
      }
      if (focusTheme) {
        const theme = (liveData.themes || []).find(t => t.key === focusTheme);
        if (theme && theme.companies && theme.companies.length) {
          return {
            name: 'root',
            children: [{
              name: theme.name,
              children: theme.companies.map(c => ({
                name: c.cn_name || c.symbol,
                symbol: c.symbol,
                change_pct: c.change_pct,
                dollar_volume: Math.max(c.dollar_volume, 1),
                flow_score: c.flow_score,
                value: Math.max(c.dollar_volume, 1),
              }))
            }]
          };
        }
      }
      const sectors = focusSector
        ? liveData.sectors.filter(s => s.key === focusSector)
        : liveData.sectors;
      return {
        name: 'root',
        children: sectors.map(s => ({
          name: s.name,
          children: s.companies.map(c => ({
            name: c.cn_name || c.symbol,
            symbol: c.symbol,
            change_pct: c.change_pct,
            dollar_volume: Math.max(c.dollar_volume, 1),
            flow_score: c.flow_score,
            value: Math.max(c.dollar_volume, 1),
          }))
        }))
      };
    }

    function buildHierarchyFromStats() {
      const mode = document.getElementById('viewMode').value;
      if (mode === 'sector') {
        return {
          name: 'root',
          children: (statsData.sectors || []).map(s => ({
            name: s.cn_name || s.name,
            key: s.sector_key,
            change_pct: s.period_change_pct,
            dollar_volume: Math.max(s.dollar_volume_sum, 1),
            flow_score: s.flow_score_sum,
            value: Math.max(Math.abs(s.flow_score_sum) * 1e9, s.dollar_volume_sum * 0.05, 1),
          }))
        };
      }
      const companies = focusSector
        ? (statsData.companies || []).filter(c => c.sector_key === focusSector)
        : (statsData.companies || []);
      const bySector = {};
      companies.forEach(c => {
        const key = c.sector_key || 'other';
        if (!bySector[key]) bySector[key] = { name: c.sector_name || key, children: [] };
        bySector[key].children.push({
          name: c.cn_name || c.symbol,
          symbol: c.symbol,
          change_pct: c.period_change_pct,
          dollar_volume: Math.max(c.dollar_volume_sum, 1),
          flow_score: c.flow_score_sum,
          value: Math.max(c.dollar_volume_sum, 1),
        });
      });
      return { name: 'root', children: Object.values(bySector) };
    }

    function render() {
      const mode = document.getElementById('viewMode').value;
      const crumb = document.getElementById('breadcrumb');
      const hierarchy = usingLive()
        ? (liveData ? buildHierarchyFromLive() : null)
        : (statsData && statsData.sufficient ? buildHierarchyFromStats() : null);

      if (!hierarchy || !hierarchy.children || !hierarchy.children.length) {
        const msg = usingLive()
          ? ((liveData && liveData.success === false && liveData.note) || '行情拉取失败，请稍后刷新')
          : ((statsData && statsData.note) || '该周期数据还不足，请先积累交易日快照');
        document.getElementById('treemap').innerHTML = `<div class="loading">${msg}</div>`;
        document.getElementById('smallLabels').innerHTML = '';
        return;
      }

      if (mode === 'company' && focusTheme) {
        const theme = (liveData.themes || []).find(t => t.key === focusTheme);
        crumb.innerHTML = `<a href="#" onclick="focusTheme=null;focusSector=null;renderThemes();render();return false">全部</a> / 主题：${theme ? theme.name : focusTheme}`;
      } else if (mode === 'company' && focusSector) {
        crumb.innerHTML = `<a href="#" onclick="focusSector=null;render();return false">全部板块</a> / ${focusSector}`;
      } else if (usingLive()) {
        crumb.textContent = '今日实时：方块大小≈资金流强度；颜色与% = 占本站主要板块/龙头样本的资金活跃度比重（红流入绿流出，非股价、非全市场）';
      } else {
        crumb.textContent = `${statsData.label}：颜色与% = 占本站样本的资金活跃度比重（红流入绿流出；共 ${statsData.snapshot_count} 个交易日快照）`;
      }

      const el = document.getElementById('treemap');
      el.innerHTML = '';
      const width = el.clientWidth || 800;
      const height = 620;
      const root = d3.hierarchy(hierarchy)
        .sum(d => d.value || 0)
        .sort((a, b) => (b.value || 0) - (a.value || 0));

      const leaves = root.leaves();
      const leafAbsTotal = leaves.reduce((s, d) => s + Math.abs(Number(d.data.flow_score || 0)), 0) || 1;
      leaves.forEach(d => {
        d.data.flow_share_pct = flowSharePct(d.data.flow_score, leafAbsTotal);
      });

      d3.treemap().size([width, height]).paddingInner(3).paddingTop(mode === 'company' ? 22 : 3).round(true)(root);
      const svg = d3.select('#treemap').append('svg').attr('width', width).attr('height', height);

      if (mode === 'company') {
        svg.selectAll('g.sector-label').data(root.children || []).enter().append('text')
          .attr('x', d => d.x0 + 4).attr('y', d => d.y0 + 14)
          .attr('fill', '#e2e8f0').attr('font-size', 12).attr('font-weight', 600).text(d => d.data.name);
      }

      const smallItems = [];
      const nodes = svg.selectAll('g.node').data(leaves).enter().append('g')
        .attr('transform', d => `translate(${d.x0},${d.y0})`)
        .style('cursor', 'pointer')
        .on('click', (_, d) => {
          if (mode === 'sector' && d.data.key) {
            focusSector = d.data.key;
            document.getElementById('viewMode').value = 'company';
            render();
          }
        });

      nodes.append('rect')
        .attr('width', d => Math.max(0, d.x1 - d.x0))
        .attr('height', d => Math.max(0, d.y1 - d.y0))
        .attr('fill', d => colorForFlow(d.data.flow_share_pct))
        .attr('stroke', '#0f172a')
        .attr('stroke-width', 1)
        .attr('rx', 3);
      nodes.append('title').text(d => {
        const name = d.data.symbol ? `${d.data.name} (${d.data.symbol})` : d.data.name;
        return `${name}\n资金流占比: ${fmtPct(d.data.flow_share_pct)}\n资金流: ${Number(d.data.flow_score || 0).toFixed(2)}\n股价涨跌: ${fmtPct(d.data.change_pct)}\n成交额: $${fmtMoney(d.data.dollar_volume)}`;
      });

      nodes.each(function(d) {
        const w = d.x1 - d.x0, h = d.y1 - d.y0;
        const label = d.data.symbol || d.data.name || '';
        const pct = fmtPct(d.data.flow_share_pct);
        const fill = '#fff';
        const g = d3.select(this);
        const isCjk = /[\u4e00-\u9fff]/.test(label);

        // 估算：中文约等于字号宽度，英文约 0.62 字号
        function textWidth(str, fs) {
          let n = 0;
          for (const ch of str) n += /[\u4e00-\u9fff]/.test(ch) ? 1 : 0.62;
          return n * fs;
        }

        function appendHorizontal(text, x, y, fs, weight) {
          g.append('text').attr('x', x).attr('y', y).attr('fill', fill)
            .attr('font-size', fs).attr('font-weight', weight || 700).text(text);
        }

        function appendVertical(chars, x, startY, fs, lineGap) {
          chars.forEach((ch, i) => {
            g.append('text').attr('x', x).attr('y', startY + i * lineGap)
              .attr('fill', fill).attr('font-size', fs).attr('font-weight', 700).text(ch);
          });
        }

        function appendWrappedCjk(text, x, y, fs, maxCharsPerLine) {
          const lines = [];
          for (let i = 0; i < text.length; i += maxCharsPerLine) {
            lines.push(text.slice(i, i + maxCharsPerLine));
          }
          lines.slice(0, 3).forEach((line, i) => {
            appendHorizontal(line, x, y + i * (fs + 2), fs, 700);
          });
          return lines.length;
        }

        // 太小：放到图下方色块标签
        if (w < 28 || h < 20) {
          smallItems.push({
            label,
            pct,
            flow_share_pct: d.data.flow_share_pct,
            name: d.data.name,
          });
          return;
        }

        // 窄而高：竖排「通 / 信 / 服 / 务」，避免横向截断
        if (w < 70 && h >= 56 && isCjk && label.length >= 2) {
          const fs = Math.min(13, Math.max(9, w - 10));
          const lineGap = fs + 2;
          const maxChars = Math.max(1, Math.floor((h - (h >= 40 ? 22 : 8)) / lineGap));
          const chars = [...label].slice(0, maxChars);
          const blockH = chars.length * lineGap;
          const startY = Math.max(fs, Math.floor((h - blockH - (h >= 40 ? 16 : 0)) / 2) + fs);
          appendVertical(chars, Math.max(2, Math.floor((w - fs) / 2)), startY, fs, lineGap);
          if (h - (startY + blockH) >= 14 || h >= 70) {
            const pctFs = Math.min(10, Math.max(8, w - 8));
            if (textWidth(pct, pctFs) <= w - 4) {
              appendHorizontal(pct, Math.max(2, (w - textWidth(pct, pctFs)) / 2), Math.min(h - 4, startY + blockH + 2), pctFs, 600);
            }
          }
          return;
        }

        // 偏窄中文：两字换行，如「通信」「服务」
        if (w < 96 && isCjk && label.length >= 4 && h >= 40) {
          const fs = Math.min(13, Math.max(10, Math.floor(w / 3.2)));
          const perLine = textWidth(label.slice(0, 2), fs) <= w - 8 ? 2 : 1;
          const lineCount = appendWrappedCjk(label, 4, fs + 2, fs, perLine);
          if (h >= fs * lineCount + 28) {
            appendHorizontal(pct, 4, fs + 2 + lineCount * (fs + 2) + 4, 10, 600);
          }
          return;
        }

        // 常规横排：按宽度裁剪，保证不溢出
        if (w >= 40 && h >= 28) {
          const fs = Math.min(14, Math.max(10, Math.floor(w / 8)));
          let shown = label;
          const fits = (s) => textWidth(s, fs) <= w - 10;
          if (!fits(shown)) {
            while (shown.length > 1 && !fits(shown + '…')) shown = shown.slice(0, -1);
            shown = shown.length < label.length ? shown + '…' : shown;
          }
          if (!fits(shown) && shown === '…') {
            smallItems.push({
              label,
              pct,
              flow_share_pct: d.data.flow_share_pct,
              name: d.data.name,
            });
            return;
          }
          appendHorizontal(shown, 6, fs + 4, fs, 700);
          if (h >= 48 && textWidth(pct, 11) <= w - 10) {
            appendHorizontal(pct, 6, fs + 20, 11, 600);
          }
          return;
        }

        // 其余：下方芯片
        smallItems.push({
          label,
          pct,
          flow_share_pct: d.data.flow_share_pct,
          name: d.data.name,
        });
      });

      const chipBox = document.getElementById('smallLabels');
      if (smallItems.length) {
        chipBox.innerHTML = '<span class="muted" style="width:100%;font-size:0.75rem;margin-bottom:2px">区块过小未标在图内（% = 资金流占比）：</span>' +
          smallItems.map(item =>
            `<span class="small-chip" style="background:${colorForFlow(item.flow_share_pct)}" title="${item.name || item.label}">${item.label} ${item.pct}</span>`
          ).join('');
      } else {
        chipBox.innerHTML = '';
      }
    }

    async function loadLive(force = false) {
      const res = await fetch('/api/heatmap' + (force ? '?force=true' : ''));
      if (!res.ok) throw new Error('行情 HTTP ' + res.status);
      liveData = await res.json();
      document.getElementById('metaLine').textContent =
        (liveData.success === false
          ? `行情拉取失败 · ${liveData.updated_at} · ${liveData.source || '?'}（${liveData.quote_count || 0}/${liveData.quote_total || '?'}）`
          : `更新时间 ${liveData.updated_at} · 数据源 ${liveData.source || '?'}` +
            (liveData.quote_count != null ? `（${liveData.quote_count}/${liveData.quote_total || '?'}）` : '')) +
        ` · 美股收盘后自动存快照（美东 16:30）`;
      if (usingLive()) document.getElementById('note').textContent = liveData.note || '';
      renderThemes();
      renderFlow();
    }

    async function loadStats() {
      const period = currentPeriod();
      const treemap = document.getElementById('treemap');
      const meta = document.getElementById('metaLine');
      const note = document.getElementById('note');

      if (usingLive()) {
        meta.textContent = liveData
          ? (liveData.success === false
            ? `行情拉取失败 · ${liveData.updated_at} · ${liveData.source || '?'}（${liveData.quote_count || 0}/${liveData.quote_total || '?'}）`
            : `今日实时 · 更新时间 ${liveData.updated_at} · 数据源 ${liveData.source || '?'}` +
              (liveData.quote_count != null ? `（${liveData.quote_count}/${liveData.quote_total || '?'}）` : ''))
          : '今日实时加载中...';
        note.textContent = (liveData && liveData.note) || '';
        renderThemes();
        renderFlow();
        renderSidebar();
        render();
        return;
      }

      document.getElementById('themePanel').style.display = 'none';
      document.getElementById('flowPanel').style.display = 'none';

      treemap.innerHTML = '<div class="loading">正在加载周期统计...</div>';
      document.getElementById('topSectors').innerHTML = '<li class="muted">加载中...</li>';
      document.getElementById('bottomSectors').innerHTML = '<li class="muted">加载中...</li>';
      document.getElementById('topCompanies').innerHTML = '<li class="muted">加载中...</li>';
      document.getElementById('bottomCompanies').innerHTML = '<li class="muted">加载中...</li>';
      meta.textContent = `切换到「${document.getElementById('periodSelect').selectedOptions[0].text}」...`;

      try {
        const res = await fetch('/api/heatmap/stats?period=' + encodeURIComponent(period) + '&_=' + Date.now());
        if (!res.ok) throw new Error('统计 HTTP ' + res.status);
        statsData = await res.json();

        const label = statsData.label || period;
        if (!statsData.sufficient) {
          meta.textContent =
            `周期：${label} · 数据还不足（${statsData.snapshot_count || 0}/${statsData.min_snapshots || '?'} 天）`;
          note.textContent = statsData.note || '数据还不足';
          document.getElementById('topSectors').innerHTML =
            `<li class="muted">${statsData.note || '数据还不足'}</li>`;
          document.getElementById('bottomSectors').innerHTML = '<li class="muted">暂无数据</li>';
          document.getElementById('topCompanies').innerHTML = '<li class="muted">暂无数据</li>';
          document.getElementById('bottomCompanies').innerHTML = '<li class="muted">暂无数据</li>';
          treemap.innerHTML = `<div class="loading">${statsData.note || '该周期数据还不足'}</div>`;
          document.getElementById('smallLabels').innerHTML = '';
          return;
        }

        meta.textContent =
          `周期：${label} · 已有 ${statsData.snapshot_count} 个交易日快照` +
          (statsData.latest_trade_date ? ` · 最新 ${statsData.latest_trade_date}` : '');
        note.textContent = statsData.note || '';
        renderSidebar();
        render();
      } catch (e) {
        meta.textContent = '周期统计加载失败';
        note.textContent = String(e.message || e);
        treemap.innerHTML = `<div class="loading">加载失败：${e.message}</div>`;
        document.getElementById('smallLabels').innerHTML = '';
        document.getElementById('topSectors').innerHTML = '<li class="muted">加载失败</li>';
        document.getElementById('bottomSectors').innerHTML = '<li class="muted">加载失败</li>';
        document.getElementById('topCompanies').innerHTML = '<li class="muted">加载失败</li>';
        document.getElementById('bottomCompanies').innerHTML = '<li class="muted">加载失败</li>';
      }
    }

    async function reloadAll(force = false) {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '刷新中...';
      try {
        await loadLive(force);
        await loadStats();
      } catch (e) {
        document.getElementById('treemap').innerHTML = `<div class="loading">加载失败：${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '刷新';
      }
    }

    async function saveSnapshot() {
      const btn = document.getElementById('snapBtn');
      btn.disabled = true;
      btn.textContent = '保存中...';
      try {
        const res = await fetch('/api/heatmap/snapshot', { method: 'POST' });
        const data = await res.json();
        alert(data.skipped ? (data.reason || '已跳过') : `已保存 ${data.trade_date}，共 ${data.saved} 条`);
        await reloadAll(true);
      } catch (e) {
        alert('保存失败: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '存今日快照';
      }
    }

    const LIVE_REFRESH_MS = 60_000;
    let liveReloading = false;
    let countdownSec = LIVE_REFRESH_MS / 1000;

    function updateTimerUI() {
      const tt = document.getElementById('themeTimer');
      const ht = document.getElementById('heatmapTimer');
      const ft = document.getElementById('flowTimer');
      if (!usingLive()) { tt.textContent = ''; ht.textContent = ''; if(ft) ft.textContent = ''; return; }
      const label = liveReloading ? '刷新中...' : countdownSec + 's 后自动刷新';
      tt.textContent = label;
      ht.textContent = label;
      if(ft) ft.textContent = label;
    }

    setInterval(() => {
      if (!usingLive()) return;
      countdownSec = Math.max(0, countdownSec - 1);
      updateTimerUI();
    }, 1000);

    setInterval(async () => {
      if (!usingLive() || liveReloading) return;
      liveReloading = true;
      updateTimerUI();
      try {
        await reloadAll(true);
      } finally {
        liveReloading = false;
        countdownSec = LIVE_REFRESH_MS / 1000;
        updateTimerUI();
      }
    }, LIVE_REFRESH_MS);

    window.addEventListener('resize', () => { render(); renderFlow(); });
    reloadAll();
  </script>
</body>
