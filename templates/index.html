<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基金额度监测</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --green: #059669;
      --red: #dc2626;
      --orange: #d97706;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .status-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .badge-trading { background: #d1fae5; color: #065f46; }
    .badge-holiday { background: #fef3c7; color: #92400e; }
    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow);
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12); }
    .card-changed {
      border: 2px solid #f59e0b;
      background: #fffbeb;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.22);
    }
    .card-changed:hover { border-color: #d97706; box-shadow: 0 6px 18px rgba(245, 158, 11, 0.28); }
    .card-changed .card-quota { color: #b45309; }
    .card-change-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #f59e0b;
      color: #fff;
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .card-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
    .card-code { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }
    .card-quota { font-size: 1.6rem; font-weight: 700; }
    .card-prev {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .card-prev strong { color: var(--text); font-weight: 500; }
    .card-status {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .status-limited { background: #dbeafe; color: #1d4ed8; }
    .status-suspended { background: #fee2e2; color: #b91c1c; }
    .status-unknown { background: #f1f5f9; color: #64748b; }
    .chart-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chart-header h2 { font-size: 1.1rem; font-weight: 600; }
    select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .chart-wrap { position: relative; height: 380px; }
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>基金额度监测</h1>
        <div class="status-bar" id="statusBar"></div>
      </div>
      <button class="btn btn-primary" id="scrapeBtn" onclick="triggerScrape()">立即抓取</button>
    </header>

    <div class="cards" id="fundCards">
      <div class="loading">加载中...</div>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <h2>额度变化趋势</h2>
        <div>
          <select id="fundSelect" onchange="updateChart()"></select>
          <select id="daysSelect" onchange="updateChart()" style="margin-left:8px">
            <option value="30">近1月</option>
            <option value="90">近3月</option>
            <option value="180">近6月</option>
            <option value="365" selected>近1年</option>
            <option value="730">近2年</option>
          </select>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="quotaChart"></canvas>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let funds = [];
    let chart = null;
    const chartTheme = {
      accent: '#2563eb',
      fill: 'rgba(37, 99, 235, 0.08)',
      muted: '#64748b',
      grid: '#e2e8f0',
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function formatQuota(q) {
      if (q === 0 || q === null) return '0 元';
      return q.toLocaleString('zh-CN', {minimumFractionDigits: 2}) + ' 元';
    }

    function formatQuotaCard(q) {
      if (q === 0 || q === null) return '0 元';
      return q.toLocaleString('zh-CN', { maximumFractionDigits: 0 }) + ' 元';
    }

    function statusClass(s) {
      if (s === '限大额') return 'status-limited';
      if (s === '暂停申购') return 'status-suspended';
      return 'status-unknown';
    }

    function hasChanged(f) {
      if (f.previous_quota == null) return false;
      return f.previous_quota !== f.quota || f.previous_status !== f.status;
    }

    async function loadStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      const bar = document.getElementById('statusBar');
      const badge = data.is_trading_day
        ? '<span class="badge badge-trading">交易日</span>'
        : '<span class="badge badge-holiday">非交易日</span>';
      bar.innerHTML = badge + `<span>抓取时间: 每日 ${data.scrape_times.join(' / ')}</span>`;
    }

    async function loadFunds() {
      const res = await fetch('/api/funds');
      funds = await res.json();
      funds.sort((a, b) => (b.quota ?? -1) - (a.quota ?? -1));
      const cards = document.getElementById('fundCards');
      if (!funds.length) {
        cards.innerHTML = '<div class="loading">暂无数据，请点击"立即抓取"</div>';
        return;
      }
      cards.innerHTML = funds.map(f => {
        const changed = hasChanged(f);
        const prevBlock = changed
          ? `<div class="card-prev">上次：<strong>${formatQuotaCard(f.previous_quota)}</strong> · <span class="card-status ${statusClass(f.previous_status)}">${f.previous_status}</span></div>`
          : '';
        return `
        <div class="card${changed ? ' card-changed' : ''}">
          ${changed ? '<span class="card-change-badge">额度变化</span>' : ''}
          <div class="card-name">${f.name}</div>
          <div class="card-code">${f.code}</div>
          <div class="card-quota">${formatQuotaCard(f.quota)}</div>
          <span class="card-status ${statusClass(f.status)}">${f.status || '未知'}</span>
          ${prevBlock}
        </div>
      `;
      }).join('');

      const sel = document.getElementById('fundSelect');
      sel.innerHTML = funds.map(f =>
        `<option value="${f.code}">${f.name} (${f.code})</option>`
      ).join('');
    }

    async function updateChart() {
      const code = document.getElementById('fundSelect').value;
      const days = document.getElementById('daysSelect').value;
      if (!code) return;

      const res = await fetch(`/api/history/${code}?days=${days}`);
      const data = await res.json();

      const labels = data.map(d => {
        const dt = new Date(d.scraped_at);
        return dt.toLocaleDateString('zh-CN') + ' ' + dt.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
      });
      const values = data.map(d => d.quota);

      if (chart) chart.destroy();
      const ctx = document.getElementById('quotaChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '单日累计购买上限 (元)',
            data: values,
            borderColor: chartTheme.accent,
            backgroundColor: chartTheme.fill,
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: chartTheme.muted } },
            tooltip: {
              callbacks: {
                label: ctx => formatQuota(ctx.parsed.y)
              }
            }
          },
          scales: {
            x: { ticks: { color: chartTheme.muted, maxRotation: 45 }, grid: { color: chartTheme.grid } },
            y: { ticks: { color: chartTheme.muted }, grid: { color: chartTheme.grid }, beginAtZero: true }
          }
        }
      });
    }

    async function triggerScrape() {
      const btn = document.getElementById('scrapeBtn');
      btn.disabled = true;
      btn.textContent = '抓取中...';
      try {
        const res = await fetch('/api/scrape', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          const msg = data.changes.length
            ? `抓取完成，${data.changes.length} 支基金额度发生变化`
            : '抓取完成，额度无变化';
          showToast(msg);
        } else {
          showToast(data.message || '抓取失败');
        }
        await refresh();
      } catch (e) {
        showToast('抓取出错: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '立即抓取';
      }
    }

    async function refresh() {
      await loadFunds();
      await updateChart();
    }

    async function init() {
      await loadStatus();
      await loadFunds();
      if (funds.length) await updateChart();
    }

    init();
  </script>
</body>
</html>
