<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基金额度监测</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e6ed;
      --text-muted: #8b8fa3;
      --accent: #4f8cff;
      --green: #34d399;
      --red: #f87171;
      --orange: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .status-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .badge-trading { background: #064e3b; color: var(--green); }
    .badge-holiday { background: #451a03; color: var(--orange); }
    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
    .card-code { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }
    .card-quota { font-size: 1.6rem; font-weight: 700; }
    .card-status {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .status-limited { background: #1e3a5f; color: var(--accent); }
    .status-suspended { background: #4a1c1c; color: var(--red); }
    .status-unknown { background: #333; color: var(--text-muted); }
    .chart-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chart-header h2 { font-size: 1.1rem; font-weight: 600; }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .chart-wrap { position: relative; height: 380px; }
    .table-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 500; }
    tr:hover td { background: rgba(79, 140, 255, 0.05); }
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>基金额度监测</h1>
        <div class="status-bar" id="statusBar"></div>
      </div>
      <button class="btn btn-primary" id="scrapeBtn" onclick="triggerScrape()">立即抓取</button>
    </header>

    <div class="cards" id="fundCards">
      <div class="loading">加载中...</div>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <h2>额度变化趋势</h2>
        <div>
          <select id="fundSelect" onchange="updateChart()"></select>
          <select id="daysSelect" onchange="updateChart()" style="margin-left:8px">
            <option value="7">近7天</option>
            <option value="30" selected>近30天</option>
            <option value="90">近90天</option>
          </select>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="quotaChart"></canvas>
      </div>
    </div>

    <div class="table-section">
      <h2 style="font-size:1.1rem;margin-bottom:14px">历史记录</h2>
      <table>
        <thead>
          <tr>
            <th>基金</th>
            <th>代码</th>
            <th>状态</th>
            <th>额度</th>
            <th>抓取时间</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let funds = [];
    let chart = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function formatQuota(q) {
      if (q === 0 || q === null) return '0 元';
      return q.toLocaleString('zh-CN', {minimumFractionDigits: 2}) + ' 元';
    }

    function statusClass(s) {
      if (s === '限大额') return 'status-limited';
      if (s === '暂停申购') return 'status-suspended';
      return 'status-unknown';
    }

    async function loadStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      const bar = document.getElementById('statusBar');
      const badge = data.is_trading_day
        ? '<span class="badge badge-trading">交易日</span>'
        : '<span class="badge badge-holiday">非交易日</span>';
      bar.innerHTML = badge + `<span>抓取时间: 每日 ${data.scrape_hours.join(':00 / ')}:00</span>`;
    }

    async function loadFunds() {
      const res = await fetch('/api/funds');
      funds = await res.json();
      const cards = document.getElementById('fundCards');
      if (!funds.length) {
        cards.innerHTML = '<div class="loading">暂无数据，请点击"立即抓取"</div>';
        return;
      }
      cards.innerHTML = funds.map(f => `
        <div class="card">
          <div class="card-name">${f.name}</div>
          <div class="card-code">${f.code}</div>
          <div class="card-quota">${formatQuota(f.quota)}</div>
          <span class="card-status ${statusClass(f.status)}">${f.status || '未知'}</span>
        </div>
      `).join('');

      const sel = document.getElementById('fundSelect');
      sel.innerHTML = funds.map(f =>
        `<option value="${f.code}">${f.name} (${f.code})</option>`
      ).join('');
    }

    async function loadHistory() {
      const res = await fetch('/api/history?days=30');
      const data = await res.json();
      const tbody = document.getElementById('historyBody');
      const sorted = data.sort((a, b) => new Date(b.scraped_at) - new Date(a.scraped_at));
      tbody.innerHTML = sorted.slice(0, 50).map(r => `
        <tr>
          <td>${r.fund_name}</td>
          <td>${r.fund_code}</td>
          <td><span class="card-status ${statusClass(r.status)}">${r.status}</span></td>
          <td>${formatQuota(r.quota)}</td>
          <td>${new Date(r.scraped_at).toLocaleString('zh-CN')}</td>
        </tr>
      `).join('');
    }

    async function updateChart() {
      const code = document.getElementById('fundSelect').value;
      const days = document.getElementById('daysSelect').value;
      if (!code) return;

      const res = await fetch(`/api/history/${code}?days=${days}`);
      const data = await res.json();

      const labels = data.map(d => {
        const dt = new Date(d.scraped_at);
        return dt.toLocaleDateString('zh-CN') + ' ' + dt.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
      });
      const values = data.map(d => d.quota);

      if (chart) chart.destroy();
      const ctx = document.getElementById('quotaChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '单日累计购买上限 (元)',
            data: values,
            borderColor: '#4f8cff',
            backgroundColor: 'rgba(79,140,255,0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#8b8fa3' } },
            tooltip: {
              callbacks: {
                label: ctx => formatQuota(ctx.parsed.y)
              }
            }
          },
          scales: {
            x: { ticks: { color: '#8b8fa3', maxRotation: 45 }, grid: { color: '#2a2d3a' } },
            y: { ticks: { color: '#8b8fa3' }, grid: { color: '#2a2d3a' }, beginAtZero: true }
          }
        }
      });
    }

    async function triggerScrape() {
      const btn = document.getElementById('scrapeBtn');
      btn.disabled = true;
      btn.textContent = '抓取中...';
      try {
        const res = await fetch('/api/scrape', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          const msg = data.changes.length
            ? `抓取完成，${data.changes.length} 支基金额度发生变化`
            : '抓取完成，额度无变化';
          showToast(msg);
        } else {
          showToast(data.message || '抓取失败');
        }
        await refresh();
      } catch (e) {
        showToast('抓取出错: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '立即抓取';
      }
    }

    async function refresh() {
      await loadFunds();
      await loadHistory();
      await updateChart();
    }

    async function init() {
      await loadStatus();
      await loadFunds();
      await loadHistory();
      if (funds.length) await updateChart();
    }

    init();
  </script>
</body>
</html>
