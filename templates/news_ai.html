<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI产业链合作新闻监控</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 980px; margin: 0 auto; padding: 24px 20px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
    }
    h1 { font-size: 1.35rem; font-weight: 650; }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
      background: #0f172a; color: #fff; font-weight: 600; font-size: 0.85rem;
      box-shadow: var(--shadow);
    }
    .btn.secondary { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 14px 14px;
      margin-bottom: 12px;
    }
    .meta {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px;
    }
    .tag {
      font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      background: #dbeafe; color: #1d4ed8;
    }
    .tag.phone {
      background: #fef3c7; color: #92400e;
      border: 1px solid #f59e0b;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-top: 6px; }
    .loading { padding: 30px 10px; color: var(--text-muted); text-align: center; }
    .row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>AI产业链合作新闻监控</h1>
        <div style="color:var(--text-muted);font-size:0.85rem;margin-top:4px">重点消息才推手机（AI巨头合作 + 算力/云/基础设施信号）</div>
      </div>
      <div class="row-actions">
        <a class="btn secondary" href="/heatmap">返回热力图</a>
        <button class="btn" id="checkBtn" onclick="checkNow()">立刻检查</button>
      </div>
    </header>

    <div class="card">
      <div class="meta">
        <span id="status">加载中...</span>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function fmtPub(iso) {
      if (!iso) return '';
      const dt = new Date(iso);
      if (Number.isNaN(dt.getTime())) return iso;
      return dt.toLocaleString('zh-CN');
    }

    function renderItems(data) {
      const list = document.getElementById('list');
      if (!data || data.success === false) {
        list.innerHTML = `<div class="loading">${escapeHtml(data && data.message ? data.message : '暂无数据')}</div>`;
        return;
      }
      const items = data.items || [];
      if (!items.length) {
        list.innerHTML = `<div class="loading">暂无命中消息，稍后自动刷新。</div>`;
        return;
      }
      list.innerHTML = items.map(it => {
        const tag = it.priority === 'phone' ? `<span class="tag phone">重点推送</span>` : `<span class="tag">候选</span>`;
        return `
          <div class="card" style="margin-top:12px">
            <div class="meta">
              ${tag}
              <span>score: ${it.score}</span>
              <span>${escapeHtml(it.pub || '')}</span>
            </div>
            <div style="font-weight:700;line-height:1.35">
              <a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>
            </div>
            ${it.desc ? `<div class="desc">${escapeHtml(it.desc)}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    async function loadLatest() {
      const status = document.getElementById('status');
      status.textContent = '加载中...';
      try {
        const res = await fetch('/api/news/ai/latest?_=' + Date.now());
        const data = await res.json();
        status.textContent = data.ts ? `更新时间：${data.ts}` : (data.updated_at || '已更新');
        renderItems(data);
      } catch (e) {
        status.textContent = '加载失败：' + e.message;
      }
    }

    async function checkNow() {
      const btn = document.getElementById('checkBtn');
      btn.disabled = true;
      btn.textContent = '检查中...';
      try {
        await fetch('/api/news/ai/check', { method: 'POST' });
      } finally {
        btn.disabled = false;
        btn.textContent = '立刻检查';
        await loadLatest();
      }
    }

    loadLatest();
    setInterval(loadLatest, 60 * 1000);
  </script>
</body>
</html>
